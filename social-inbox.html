<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رسائل الطلاب | ZM Academy</title><link rel="stylesheet" href="./social-pages.css"></head><body><div class="app"><header class="top"><a class="brand" href="./admin.html">✦ ZM Academy · الإدارة</a><a class="ghost" href="./social-admin.html" style="padding:8px 12px;border-radius:10px">إدارة المجتمع ↗</a></header><main class="panel" style="margin-top:16px"><h1>رسائل الطلاب</h1><div id="status" class="status">جارٍ تحميل المحادثات...</div><div class="layout" style="grid-template-columns:minmax(220px,.7fr) 1.3fr"><section><h2>المحادثات</h2><div id="conversations"></div></section><section><h2 id="threadTitle">اختر محادثة</h2><div id="thread"></div><div class="field"><textarea id="reply" maxlength="2000" placeholder="اكتب ردك..."></textarea></div><button id="send" disabled>إرسال الرد</button></section></div></main></div><script>
const API='https://zm-academy-api.ziadmohsen4567.workers.dev',token=localStorage.getItem('zm_admin_token')||sessionStorage.getItem('zm_admin_token')||'',$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opts={}){if(!token){location.replace('./admin.html');throw Error('يلزم تسجيل الدخول')}const h={Authorization:'Bearer '+token,...(opts.headers||{})};if(opts.body)h['Content-Type']='application/json';const r=await fetch(API+path,{...opts,headers:h}),d=await r.json().catch(()=>({}));if(!r.ok||d.success===false)throw Error(d.error||'تعذر الطلب');return d}let current=null;
function status(s){$('#status').textContent=s}
async function load(){try{const d=await api('/api/admin/platform/messages');const rows=d.conversations||[];$('#conversations').innerHTML=rows.map(x=>'<button class="ghost" style="display:block;width:100%;text-align:right;margin:7px 0" data-chat="'+x.teacher_id+':'+x.student_id+'"><b>'+esc(x.student_name)+'</b><div class="muted">'+esc(x.display_name)+' · '+esc(x.last_message||'')+'</div><small>'+esc(x.unread||0)+' رسائل غير مقروءة</small></button>').join('')||'<div class="empty">لا توجد رسائل بعد.</div>';document.querySelectorAll('[data-chat]').forEach(b=>b.onclick=()=>open(b.dataset.chat));status('صندوق الرسائل جاهز.')}catch(e){status(e.message)}}
async function open(key){const a=key.split(':');current={teacher_id:Number(a[0]),student_id:Number(a[1])};try{const d=await api('/api/admin/platform/messages?teacher_id='+current.teacher_id+'&student_id='+current.student_id);const rows=d.messages||[];$('#threadTitle').textContent=(rows[0]?.student_name||'الطالب')+' — '+(rows[0]?.teacher_name||'المدرس');$('#thread').innerHTML=rows.map(m=>'<div class="status"><b>'+(m.sender_type==='teacher'?'رد الأكاديمية':'الطالب')+'</b><div>'+esc(m.body)+'</div><small>'+esc(m.created_at||'')+'</small></div>').join('');$('#send').disabled=false}catch(e){status(e.message)}}
$('#send').onclick=async()=>{try{if(!current)return;const body=$('#reply').value.trim();if(!body)return;await api('/api/admin/platform/messages',{method:'POST',body:JSON.stringify({...current,body})});$('#reply').value='';open(current.teacher_id+':'+current.student_id);status('تم إرسال الرد.')}catch(e){status(e.message)}};load();
</script></body></html>
