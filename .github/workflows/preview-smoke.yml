name: ZM Academy isolated Preview D1 smoke test

on:
  pull_request:
    branches:
      - main
    paths:
      - "worker.js"
      - "migrations/**"
      - "wrangler.preview.toml"
      - "tests/preview-smoke-*.sql"
      - ".github/workflows/preview-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zm-academy-preview-d1-smoke
  cancel-in-progress: true

jobs:
  preview-smoke:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate project
        run: npm run check:all

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Apply migrations to isolated Preview D1 only
        run: wrangler d1 migrations apply zm-academy-preview-db --remote --config wrangler.preview.toml

      - name: Deploy isolated Preview Worker
        run: wrangler deploy --config wrangler.preview.toml

      - name: Exercise admin setup, login, and recursive material deletion
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://zm-academy-api-preview.ziadmohsen4567.workers.dev"
          SETUP_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(36))')"
          ADMIN_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_urlsafe(36))')"
          echo "::add-mask::$SETUP_KEY"
          echo "::add-mask::$ADMIN_PASSWORD"

          # Reset only the dedicated Preview D1 database.
          timeout 60s wrangler d1 execute zm-academy-preview-db --remote --config wrangler.preview.toml --file=tests/preview-smoke-reset.sql

          printf '%s' "$SETUP_KEY" | wrangler secret put ADMIN_SETUP_KEY --config wrangler.preview.toml
          sleep 5

          HEALTH_STATUS="$(curl --max-time 30 --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors "$API/api/health" -o /tmp/zm-health.json -w '%{http_code}')"
          echo "Preview health HTTP status: $HEALTH_STATUS"
          cat /tmp/zm-health.json
          python3 -c "import json,sys; d=json.load(open('/tmp/zm-health.json')); assert sys.argv[1] == '200' and d.get('success') is True and d.get('database') == 'connected', d" "$HEALTH_STATUS"

          SETUP_STATUS="$(curl --max-time 30 --silent --show-error -X POST "$API/api/admin/setup" \
            -H "Content-Type: application/json" \
            --data "{\"setupKey\":\"$SETUP_KEY\",\"username\":\"preview_smoke_admin\",\"password\":\"$ADMIN_PASSWORD\"}" \
            -o /tmp/zm-setup.json -w '%{http_code}')"
          echo "Preview admin setup HTTP status: $SETUP_STATUS"
          cat /tmp/zm-setup.json
          python3 -c "import json,sys; d=json.load(open('/tmp/zm-setup.json')); assert sys.argv[1] == '201' and d.get('success') is True, d" "$SETUP_STATUS"

          curl --max-time 30 --fail --silent --show-error -X POST "$API/api/admin/login" \
            -H "Content-Type: application/json" \
            --data "{\"username\":\"preview_smoke_admin\",\"password\":\"$ADMIN_PASSWORD\"}" \
            -o /tmp/zm-login.json
          ADMIN_TOKEN="$(python3 -c "import json; print(json.load(open('/tmp/zm-login.json'))['token'])")"
          test -n "$ADMIN_TOKEN"
          echo "::add-mask::$ADMIN_TOKEN"

          timeout 60s wrangler d1 execute zm-academy-preview-db --remote --config wrangler.preview.toml --file=tests/preview-smoke-seed.sql

          # Register a student and verify the first device is held for approval.
          STUDENT_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')"
          PARENT_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')"
          echo "::add-mask::$STUDENT_PASSWORD"
          echo "::add-mask::$PARENT_PASSWORD"

          REG_STATUS="$(curl --max-time 30 --silent --show-error -X POST "$API/api/students/register" \
            -H "Content-Type: application/json" \
            --data "{\"name\":\"Preview smoke student journey\",\"phone\":\"01000000002\",\"parent_phone\":\"01000000003\",\"grade\":\"Preview\",\"school\":\"Preview school\",\"governorate\":\"Preview\",\"username\":\"preview_student\",\"password\":\"$STUDENT_PASSWORD\",\"subjects\":[990001]}" \
            -o /tmp/zm-student-register.json -w '%{http_code}')"
          python3 -c "import json,sys; d=json.load(open('/tmp/zm-student-register.json')); assert sys.argv[1] == '201' and d.get('success') is True, d" "$REG_STATUS"
          STUDENT_ID="$(python3 -c "import json; print(json.load(open('/tmp/zm-student-register.json'))['student_id'])")"

          # Create a teacher account with one explicit grade/subject assignment.
          TEACHER_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_urlsafe(30))')"
          echo "::add-mask::$TEACHER_PASSWORD"
          TEACHER_CREATE_STATUS="$(curl --max-time 30 --silent --show-error -X POST "$API/api/admin/platform/teacher-accounts" \
            -H "Authorization: Bearer $ADMIN_TOKEN" -H "Content-Type: application/json" \
            --data "{\\"username\\":\\"preview_teacher\\",\\"password\\":\\"$TEACHER_PASSWORD\\",\\"display_name\\":\\"Preview Teacher\\",\\"assignments\\":[{\\"grade\\":\\"Preview\\",\\"subject\\":\\"Logic\\"}]}" \
            -o /tmp/zm-teacher-create.json -w '%{http_code}')"
          python3 -c "import json,sys; d=json.load(open('/tmp/zm-teacher-create.json')); assert sys.argv[1]=='200' and d.get('success') is True, d" "$TEACHER_CREATE_STATUS"
          curl --max-time 30 --fail --silent --show-error -X POST "$API/api/admin/login" \
            -H "Content-Type: application/json" \
            --data "{\\"username\\":\\"preview_teacher\\",\\"password\\":\\"$TEACHER_PASSWORD\\"}" \
            -o /tmp/zm-teacher-login.json
          TEACHER_TOKEN="$(python3 -c "import json; print(json.load(open('/tmp/zm-teacher-login.json'))['token'])")"
          test -n "$TEACHER_TOKEN"
          echo "::add-mask::$TEACHER_TOKEN"
          curl --max-time 30 --fail --silent --show-error "$API/api/admin/platform/teacher-portal/me" \
            -H "Authorization: Bearer $TEACHER_TOKEN" -o /tmp/zm-teacher-me.json
          python3 -c "import json; d=json.load(open('/tmp/zm-teacher-me.json')); assert d.get('success') is True and len(d.get('assignments',[]))==1 and d['assignments'][0].get('grade')=='Preview', d"
          curl --max-time 30 --fail --silent --show-error "$API/api/admin/platform/teacher-portal/roster?grade=Preview&subject=Logic" \
            -H "Authorization: Bearer $TEACHER_TOKEN" -o /tmp/zm-teacher-roster.json
          python3 -c "import json,sys; d=json.load(open('/tmp/zm-teacher-roster.json')); assert d.get('success') is True and any(int(x['id'])==int(sys.argv[1]) for x in d.get('students',[])), d" "$STUDENT_ID"
          WRONG_SCOPE_STATUS="$(curl --max-time 30 --silent --show-error "$API/api/admin/platform/teacher-portal/roster?grade=Other&subject=Logic" \
            -H "Authorization: Bearer $TEACHER_TOKEN" -o /tmp/zm-teacher-wrong-scope.json -w '%{http_code}')"
          python3 -c "import json,sys; d=json.load(open('/tmp/zm-teacher-wrong-scope.json')); assert sys.argv[1]=='403' and d.get('success') is False, d" "$WRONG_SCOPE_STATUS"
          GLOBAL_STUDENTS_STATUS="$(curl --max-time 30 --silent --show-error "$API/api/admin/platform/students" \
            -H "Authorization: Bearer $TEACHER_TOKEN" -o /tmp/zm-teacher-global-students.json -w '%{http_code}')"
          python3 -c "import json,sys; d=json.load(open('/tmp/zm-teacher-global-students.json')); assert sys.argv[1]=='403' and d.get('success') is False, d" "$GLOBAL_STUDENTS_STATUS"
          TEACHER_ATTENDANCE_STATUS="$(curl --max-time 30 --silent --show-error "$API/api/admin/platform/attendance/sessions" \
            -H "Authorization: Bearer $TEACHER_TOKEN" -o /tmp/zm-teacher-attendance.json -w '%{http_code}')"
          python3 -c "import json,sys; d=json.load(open('/tmp/zm-teacher-attendance.json')); assert sys.argv[1]=='403' and d.get('success') is False, d" "$TEACHER_ATTENDANCE_STATUS"
          echo "Teacher account login, assigned roster, cross-scope denial, and global student/attendance denial passed."

          DEVICE_TOKEN="preview-device-token-00000000000000000000000000000000"
          DEVICE_STATUS="$(curl --max-time 30 --silent --show-error -X POST "$API/api/students/login" \
            -H "Content-Type: application/json" \
            --data "{\"username\":\"preview_student\",\"password\":\"$STUDENT_PASSWORD\",\"deviceToken\":\"$DEVICE_TOKEN\",\"deviceName\":\"Preview CI Device\"}" \
            -o /tmp/zm-device-pending.json -w '%{http_code}')"
          python3 -c "import json,sys; d=json.load(open('/tmp/zm-device-pending.json')); assert sys.argv[1] == '403' and d.get('code') == 'DEVICE_APPROVAL_REQUIRED', d" "$DEVICE_STATUS"

          curl --max-time 30 --fail --silent --show-error "$API/api/admin/device-requests" \
            -H "Authorization: Bearer $ADMIN_TOKEN" -o /tmp/zm-device-requests.json
          DEVICE_ID="$(python3 -c "import json,sys; rows=json.load(open('/tmp/zm-device-requests.json')).get('requests',[]); match=[x for x in rows if int(x.get('student_id',0))==int(sys.argv[1])]; assert match, rows; print(match[0]['id'])" "$STUDENT_ID")"
          curl --max-time 30 --fail --silent --show-error -X POST "$API/api/admin/device-requests/$DEVICE_ID/approve" \
            -H "Authorization: Bearer $ADMIN_TOKEN" -o /tmp/zm-device-approved.json

          curl --max-time 30 --fail --silent --show-error -X POST "$API/api/students/login" \
            -H "Content-Type: application/json" \
            --data "{\"username\":\"preview_student\",\"password\":\"$STUDENT_PASSWORD\",\"deviceToken\":\"$DEVICE_TOKEN\",\"deviceName\":\"Preview CI Device\"}" \
            -o /tmp/zm-student-login.json
          STUDENT_TOKEN="$(python3 -c "import json; print(json.load(open('/tmp/zm-student-login.json'))['token'])")"
          test -n "$STUDENT_TOKEN"
          echo "::add-mask::$STUDENT_TOKEN"

          curl --max-time 30 --fail --silent --show-error "$API/api/student/me" \
            -H "Authorization: Bearer $STUDENT_TOKEN" -o /tmp/zm-student-me.json
          python3 -c "import json,sys; d=json.load(open('/tmp/zm-student-me.json')); assert d.get('success') is True and d.get('student',{}).get('id') == int(sys.argv[1]), d" "$STUDENT_ID"

          curl --max-time 30 --fail --silent --show-error "$API/api/materials" \
            -H "Authorization: Bearer $STUDENT_TOKEN" -o /tmp/zm-student-materials.json
          cat /tmp/zm-student-materials.json
          timeout 60s wrangler d1 execute zm-academy-preview-db --remote --config wrangler.preview.toml \
            --command="SELECT ss.student_id,ss.subject_id,s.grade,m.id,m.subject_id,(SELECT COUNT(*) FROM archived_subjects WHERE subject_id=ss.subject_id) AS subject_archived,(SELECT COUNT(*) FROM archived_materials WHERE material_id=m.id) AS material_archived FROM student_subjects ss JOIN subjects s ON s.id=ss.subject_id LEFT JOIN materials m ON m.subject_id=ss.subject_id WHERE ss.student_id=$STUDENT_ID;"
          python3 -c "import json; d=json.load(open('/tmp/zm-student-materials.json')); assert any(int(x['id'])==990001 for x in d.get('materials',[])), d"
          echo "Student registration, device approval, login, and material visibility passed."

          # Student preferences must be reachable before the generic student API fallback.
          curl --max-time 30 --fail --silent --show-error "$API/api/student/preferences" \
            -H "Authorization: Bearer $STUDENT_TOKEN" -o /tmp/zm-student-preferences-default.json
          python3 -c "import json; d=json.load(open('/tmp/zm-student-preferences-default.json')); assert d.get('success') is True and d.get('preferences',{}).get('mode')=='dark', d"
          PREFS_STATUS="$(curl --max-time 30 --silent --show-error -X PUT "$API/api/student/preferences" \
            -H "Authorization: Bearer $STUDENT_TOKEN" -H "Content-Type: application/json" \
            --data '{"preferences":{"mode":"dark","primary":"#35B8FF","secondary":"#9270FF","fontSize":"large"}}' \
            -o /tmp/zm-student-preferences-save.json -w '%{http_code}')"
          python3 -c "import json,sys; d=json.load(open('/tmp/zm-student-preferences-save.json')); assert sys.argv[1]=='200' and d.get('success') is True, d" "$PREFS_STATUS"
          curl --max-time 30 --fail --silent --show-error "$API/api/student/preferences" \
            -H "Authorization: Bearer $STUDENT_TOKEN" -o /tmp/zm-student-preferences-readback.json
          python3 -c "import json; p=json.load(open('/tmp/zm-student-preferences-readback.json')).get('preferences',{}); assert p.get('primary')=='#35B8FF' and p.get('secondary')=='#9270FF' and p.get('fontSize')=='large' and p.get('mode')=='dark', p"
          echo "Student preferences GET/PUT/readback passed."
          # Exercise favorite add/list/remove against the legacy schema fixture.
          curl --max-time 30 --fail --silent --show-error -X POST "$API/api/student/favorites/990001" \
            -H "Authorization: Bearer $STUDENT_TOKEN" -o /tmp/zm-favorite-add.json
          python3 -c "import json; d=json.load(open('/tmp/zm-favorite-add.json')); assert d.get('success') is True, d"
          curl --max-time 30 --fail --silent --show-error "$API/api/student/favorites" \
            -H "Authorization: Bearer $STUDENT_TOKEN" -o /tmp/zm-favorites-list.json
          python3 -c "import json; d=json.load(open('/tmp/zm-favorites-list.json')); assert d.get('success') is True and any(int(x.get('material_id',0))==990001 for x in d.get('favorites',[])), d"
          curl --max-time 30 --fail --silent --show-error -X DELETE "$API/api/student/favorites/990001" \
            -H "Authorization: Bearer $STUDENT_TOKEN" -o /tmp/zm-favorite-remove.json
          python3 -c "import json; d=json.load(open('/tmp/zm-favorite-remove.json')); assert d.get('success') is True, d"
          echo "Student favorites add/list/remove passed."
          # Exercise social feed, public profile, subject ordering, teacher directory, and private messages.
          curl --max-time 30 --fail --silent --show-error -X PUT "$API/api/student/platform/profile" \
            -H "Authorization: Bearer $STUDENT_TOKEN" -H "Content-Type: application/json" \
            --data '{"display_name":"Preview Student Alias","bio":"Preview profile bio"}' -o /tmp/zm-profile-save.json
          curl --max-time 30 --fail --silent --show-error "$API/api/student/platform/profile" \
            -H "Authorization: Bearer $STUDENT_TOKEN" -o /tmp/zm-profile-read.json
          python3 -c "import json; p=json.load(open('/tmp/zm-profile-read.json')).get('profile',{}); assert p.get('display_name')=='Preview Student Alias' and p.get('bio')=='Preview profile bio', p"

          curl --max-time 30 --fail --silent --show-error -X PUT "$API/api/student/platform/subjects/order" \
            -H "Authorization: Bearer $STUDENT_TOKEN" -H "Content-Type: application/json" \
            --data '{"subject_ids":[990001]}' -o /tmp/zm-subject-order-save.json
          curl --max-time 30 --fail --silent --show-error "$API/api/student/platform/subjects/order" \
            -H "Authorization: Bearer $STUDENT_TOKEN" -o /tmp/zm-subject-order-read.json
          python3 -c "import json; d=json.load(open('/tmp/zm-subject-order-read.json')); assert d.get('subject_ids')==[990001], d"

          curl --max-time 30 --fail --silent --show-error -X POST "$API/api/admin/platform/teachers" \
            -H "Authorization: Bearer $ADMIN_TOKEN" -H "Content-Type: application/json" \
            --data '{"display_name":"Preview Teacher","subject":"Logic","grade":"Preview","bio":"Teacher profile smoke test"}' \
            -o /tmp/zm-teacher-create.json
          TEACHER_ID="$(python3 -c "import json; print(json.load(open('/tmp/zm-teacher-create.json'))['id'])")"
          curl --max-time 30 --fail --silent --show-error -X POST "$API/api/admin/platform/posts" \
            -H "Authorization: Bearer $ADMIN_TOKEN" -H "Content-Type: application/json" \
            --data '{"title":"Preview academy announcement","body":"Social feed smoke test","audience_type":"all"}' \
            -o /tmp/zm-post-create.json
          POST_ID="$(python3 -c "import json; print(json.load(open('/tmp/zm-post-create.json'))['id'])")"
          curl --max-time 30 --fail --silent --show-error "$API/api/student/platform/feed" \
            -H "Authorization: Bearer $STUDENT_TOKEN" -o /tmp/zm-feed.json
          python3 -c "import json,sys; d=json.load(open('/tmp/zm-feed.json')); assert any(int(p.get('id',0))==int(sys.argv[1]) for p in d.get('posts',[])), d" "$POST_ID"
          curl --max-time 30 --fail --silent --show-error -X POST "$API/api/student/platform/feed/$POST_ID/like" \
            -H "Authorization: Bearer $STUDENT_TOKEN" -o /tmp/zm-post-like.json
          curl --max-time 30 --fail --silent --show-error -X POST "$API/api/student/platform/feed/$POST_ID/comments" \
            -H "Authorization: Bearer $STUDENT_TOKEN" -H "Content-Type: application/json" \
            --data '{"body":"Preview comment"}' -o /tmp/zm-post-comment.json
          curl --max-time 30 --fail --silent --show-error "$API/api/student/platform/teachers" \
            -H "Authorization: Bearer $STUDENT_TOKEN" -o /tmp/zm-teachers.json
          python3 -c "import json,sys; d=json.load(open('/tmp/zm-teachers.json')); assert any(int(t.get('id',0))==int(sys.argv[1]) for t in d.get('teachers',[])), d" "$TEACHER_ID"

          curl --max-time 30 --fail --silent --show-error -X POST "$API/api/student/platform/messages" \
            -H "Authorization: Bearer $STUDENT_TOKEN" -H "Content-Type: application/json" \
            --data "{\"teacher_id\":$TEACHER_ID,\"body\":\"Preview student message\"}" -o /tmp/zm-student-message.json
          curl --max-time 30 --fail --silent --show-error "$API/api/admin/platform/messages?teacher_id=$TEACHER_ID&student_id=$STUDENT_ID" \
            -H "Authorization: Bearer $ADMIN_TOKEN" -o /tmp/zm-admin-message-thread.json
          python3 -c "import json; d=json.load(open('/tmp/zm-admin-message-thread.json')); assert any(m.get('body')=='Preview student message' for m in d.get('messages',[])), d"
          curl --max-time 30 --fail --silent --show-error -X POST "$API/api/admin/platform/messages" \
            -H "Authorization: Bearer $ADMIN_TOKEN" -H "Content-Type: application/json" \
            --data "{\"teacher_id\":$TEACHER_ID,\"student_id\":$STUDENT_ID,\"body\":\"Preview teacher reply\"}" -o /tmp/zm-admin-message-reply.json
          curl --max-time 30 --fail --silent --show-error "$API/api/student/platform/messages?teacher_id=$TEACHER_ID" \
            -H "Authorization: Bearer $STUDENT_TOKEN" -o /tmp/zm-student-message-thread.json
          python3 -c "import json; d=json.load(open('/tmp/zm-student-message-thread.json')); assert any(m.get('body')=='Preview teacher reply' for m in d.get('messages',[])), d"
          echo "Social feed, profile settings, subject ordering, teacher directory, and private messaging passed."


          # Exercise favorite add, list, remove, and empty list against the isolated Preview D1.
          FAVORITE_ADD_STATUS="$(curl --max-time 30 --silent --show-error -X POST "$API/api/student/favorites/990001" \
            -H "Authorization: Bearer $STUDENT_TOKEN" -o /tmp/zm-favorite-add.json -w '%{http_code}')"
          python3 -c "import json,sys; d=json.load(open('/tmp/zm-favorite-add.json')); assert sys.argv[1]=='201' and d.get('success') is True, d" "$FAVORITE_ADD_STATUS"
          curl --max-time 30 --fail --silent --show-error "$API/api/student/favorites" \
            -H "Authorization: Bearer $STUDENT_TOKEN" -o /tmp/zm-favorites-listed.json
          python3 -c "import json; d=json.load(open('/tmp/zm-favorites-listed.json')); assert d.get('success') is True and any(int(x.get('material_id',0))==990001 for x in d.get('favorites',[])), d"
          FAVORITE_REMOVE_STATUS="$(curl --max-time 30 --silent --show-error -X DELETE "$API/api/student/favorites/990001" \
            -H "Authorization: Bearer $STUDENT_TOKEN" -o /tmp/zm-favorite-remove.json -w '%{http_code}')"
          python3 -c "import json,sys; d=json.load(open('/tmp/zm-favorite-remove.json')); assert sys.argv[1]=='200' and d.get('success') is True, d" "$FAVORITE_REMOVE_STATUS"
          curl --max-time 30 --fail --silent --show-error "$API/api/student/favorites" \
            -H "Authorization: Bearer $STUDENT_TOKEN" -o /tmp/zm-favorites-empty.json
          python3 -c "import json; d=json.load(open('/tmp/zm-favorites-empty.json')); assert d.get('success') is True and not any(int(x.get('material_id',0))==990001 for x in d.get('favorites',[])), d"
          echo "Student favorites add/list/remove flow passed."

          # A new unapproved device must not invalidate the student's existing approved session.
          SECOND_DEVICE_TOKEN="preview-device-token-second-000000000000000000000000"
          SECOND_DEVICE_STATUS="$(curl --max-time 30 --silent --show-error -X POST "$API/api/students/login" \
            -H "Content-Type: application/json" \
            --data "{\"username\":\"preview_student\",\"password\":\"$STUDENT_PASSWORD\",\"deviceToken\":\"$SECOND_DEVICE_TOKEN\",\"deviceName\":\"Preview Second Device\"}" \
            -o /tmp/zm-device-second-pending.json -w '%{http_code}')"
          python3 -c "import json,sys; d=json.load(open('/tmp/zm-device-second-pending.json')); assert sys.argv[1]=='403' and d.get('code')=='DEVICE_APPROVAL_REQUIRED', d" "$SECOND_DEVICE_STATUS"
          curl --max-time 30 --fail --silent --show-error "$API/api/student/me" \
            -H "Authorization: Bearer $STUDENT_TOKEN" -o /tmp/zm-student-existing-device-still-active.json
          python3 -c "import json,sys; d=json.load(open('/tmp/zm-student-existing-device-still-active.json')); assert d.get('success') is True and d.get('student',{}).get('id')==int(sys.argv[1]), d" "$STUDENT_ID"
          echo "Pending second device does not block the previously approved device."

          curl --max-time 30 --fail --silent --show-error -X POST "$API/api/orders" \
            -H "Authorization: Bearer $STUDENT_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"material_id":990001}' -o /tmp/zm-order-create.json
          curl --max-time 30 --fail --silent --show-error "$API/api/student/purchases" \
            -H "Authorization: Bearer $STUDENT_TOKEN" -o /tmp/zm-student-purchases.json
          ORDER_ID="$(python3 -c "import json; d=json.load(open('/tmp/zm-student-purchases.json')); rows=[x for x in d.get('purchases',[]) if int(x.get('material_id',0))==990001]; assert rows, d; print(rows[0]['order_id'])")"
          curl --max-time 30 --fail --silent --show-error -X PATCH "$API/api/admin/orders/$ORDER_ID" \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"status":"approved"}' -o /tmp/zm-order-approved.json
          curl --max-time 30 --fail --silent --show-error "$API/api/student/purchases" \
            -H "Authorization: Bearer $STUDENT_TOKEN" -o /tmp/zm-student-purchases-approved.json
          python3 -c "import json; d=json.load(open('/tmp/zm-student-purchases-approved.json')); rows=[x for x in d.get('purchases',[]) if int(x.get('order_id',0))==int('$ORDER_ID')]; assert rows and rows[0].get('status')=='approved', d"

          # Approved purchases must block another purchase request.
          APPROVED_DUPLICATE_STATUS="$(curl --max-time 30 --silent --show-error -X POST "$API/api/orders" \
            -H "Authorization: Bearer $STUDENT_TOKEN" -H "Content-Type: application/json" \
            --data '{"material_id":990001}' -o /tmp/zm-approved-duplicate.json -w '%{http_code}')"
          python3 -c "import json,sys; d=json.load(open('/tmp/zm-approved-duplicate.json')); assert sys.argv[1]=='409' and d.get('code')=='ORDER_ALREADY_EXISTS', d" "$APPROVED_DUPLICATE_STATUS"

          # Rejected requests remain visible to students, leave the admin pending queue,
          # and allow the student to submit a fresh request for the same material.
          curl --max-time 30 --fail --silent --show-error -X POST "$API/api/orders" \
            -H "Authorization: Bearer $STUDENT_TOKEN" -H "Content-Type: application/json" \
            --data '{"material_id":990002}' -o /tmp/zm-rejected-order-create.json
          REJECTED_ORDER_ID="$(python3 -c "import json; print(json.load(open('/tmp/zm-rejected-order-create.json'))['order_id'])")"
          curl --max-time 30 --fail --silent --show-error -X PATCH "$API/api/admin/orders/$REJECTED_ORDER_ID" \
            -H "Authorization: Bearer $ADMIN_TOKEN" -H "Content-Type: application/json" \
            --data '{"status":"rejected"}' -o /tmp/zm-order-rejected.json
          curl --max-time 30 --fail --silent --show-error "$API/api/student/purchases" \
            -H "Authorization: Bearer $STUDENT_TOKEN" -o /tmp/zm-student-purchases-rejected.json
          python3 -c "import json; d=json.load(open('/tmp/zm-student-purchases-rejected.json')); rows=[x for x in d.get('purchases',[]) if int(x.get('order_id',0))==int('$REJECTED_ORDER_ID')]; assert rows and rows[0].get('status')=='rejected', d"
          curl --max-time 30 --fail --silent --show-error "$API/api/admin/orders" \
            -H "Authorization: Bearer $ADMIN_TOKEN" -o /tmp/zm-admin-pending-orders.json
          python3 -c "import json; d=json.load(open('/tmp/zm-admin-pending-orders.json')); assert all(int(x.get('id',0))!=int('$REJECTED_ORDER_ID') for x in d.get('orders',[])), d"
          RETRY_STATUS="$(curl --max-time 30 --silent --show-error -X POST "$API/api/orders" \
            -H "Authorization: Bearer $STUDENT_TOKEN" -H "Content-Type: application/json" \
            --data '{"material_id":990002}' -o /tmp/zm-retry-order.json -w '%{http_code}')"
          python3 -c "import json,sys; d=json.load(open('/tmp/zm-retry-order.json')); assert sys.argv[1]=='201' and d.get('success') is True and d.get('status')=='pending', d" "$RETRY_STATUS"
          echo "Approved duplicate prevention and rejected-order retry rules passed."

          # Register a parent, request a student link, and approve it from the admin portal.
          curl --max-time 30 --fail --silent --show-error -X POST "$API/api/parent/register" \
            -H "Content-Type: application/json" \
            --data "{\"name\":\"Preview smoke parent\",\"username\":\"preview_parent\",\"password\":\"$PARENT_PASSWORD\",\"phone\":\"01000000003\",\"email\":\"preview-parent@example.invalid\"}" \
            -o /tmp/zm-parent-register.json
          curl --max-time 30 --fail --silent --show-error -X POST "$API/api/parent/login" \
            -H "Content-Type: application/json" \
            --data "{\"username\":\"preview_parent\",\"password\":\"$PARENT_PASSWORD\"}" \
            -o /tmp/zm-parent-login.json
          PARENT_TOKEN="$(python3 -c "import json; print(json.load(open('/tmp/zm-parent-login.json'))['token'])")"
          test -n "$PARENT_TOKEN"
          echo "::add-mask::$PARENT_TOKEN"

          curl --max-time 30 --fail --silent --show-error -X POST "$API/api/parent/link-request" \
            -H "Authorization: Bearer $PARENT_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"student_username":"preview_student","student_phone":"01000000002"}' \
            -o /tmp/zm-parent-link-request.json
          curl --max-time 30 --fail --silent --show-error "$API/api/admin/platform/parent-links" \
            -H "Authorization: Bearer $ADMIN_TOKEN" -o /tmp/zm-parent-links.json
          LINK_ID="$(python3 -c "import json,sys; rows=json.load(open('/tmp/zm-parent-links.json')).get('links',[]); match=[x for x in rows if int(x.get('student_id',0))==int(sys.argv[1]) and x.get('parent_username')=='preview_parent']; assert match, rows; print(match[0]['id'])" "$STUDENT_ID")"
          curl --max-time 30 --fail --silent --show-error -X PUT "$API/api/admin/platform/parent-links/$LINK_ID" \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"status":"approved","note":"Preview end-to-end test"}' \
            -o /tmp/zm-parent-link-approved.json
          curl --max-time 30 --fail --silent --show-error "$API/api/parent/children" \
            -H "Authorization: Bearer $PARENT_TOKEN" -o /tmp/zm-parent-children.json
          python3 -c "import json; d=json.load(open('/tmp/zm-parent-children.json')); assert any(x.get('status')=='approved' for x in d.get('children',[])), d"
          curl --max-time 30 --fail --silent --show-error "$API/api/parent/children/$STUDENT_ID/overview" \
            -H "Authorization: Bearer $PARENT_TOKEN" -o /tmp/zm-parent-overview.json
          python3 -c "import json; d=json.load(open('/tmp/zm-parent-overview.json')); assert d.get('success') is True and d.get('student',{}).get('id') == int('$STUDENT_ID') and any(x.get('status')=='approved' for x in d.get('orders',[])), d"
          echo "Parent registration, link approval, and child overview passed."

          # Archive the material only after the student and parent flows have verified access.
          timeout 60s wrangler d1 execute zm-academy-preview-db --remote --config wrangler.preview.toml \
            --command="INSERT OR REPLACE INTO archived_materials (material_id) VALUES (990001);"

          # AI must fail safely and explicitly when no provider key is configured.
          AI_STATUS="$(curl --max-time 30 --silent --show-error -X POST "$API/api/student/platform/ai" \
            -H "Authorization: Bearer $STUDENT_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"prompt":"اشرح مفهوم الفرضية في المنطق باختصار"}' \
            -o /tmp/zm-ai-unconfigured.json -w '%{http_code}')"
          python3 -c "import json,sys; d=json.load(open('/tmp/zm-ai-unconfigured.json')); assert sys.argv[1]=='503' and d.get('code')=='AI_NOT_CONFIGURED', d" "$AI_STATUS"
          echo "AI missing-key safe failure passed."

          curl --max-time 30 --fail --silent --show-error -X POST "$API/api/parent/logout" \
            -H "Authorization: Bearer $PARENT_TOKEN" -o /tmp/zm-parent-logout.json
          curl --max-time 30 --fail --silent --show-error -X POST "$API/api/student/logout" \
            -H "Authorization: Bearer $STUDENT_TOKEN" -o /tmp/zm-student-logout.json

          DELETE_STATUS="$(curl --max-time 30 --silent --show-error -X DELETE "$API/api/admin/materials" \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"id":990001}' \
            -o /tmp/zm-delete.json -w '%{http_code}')"
          echo "Material deletion HTTP status: $DELETE_STATUS"
          cat /tmp/zm-delete.json
          python3 -c "import json,sys; d=json.load(open('/tmp/zm-delete.json')); assert sys.argv[1] == '200' and d.get('success') is True, d" "$DELETE_STATUS"

          timeout 60s wrangler d1 execute zm-academy-preview-db --remote --config wrangler.preview.toml \
            --command="SELECT CASE WHEN
              (SELECT COUNT(*) FROM materials WHERE id=990001)=0 AND
              (SELECT COUNT(*) FROM orders WHERE material_id=990001)=0 AND
              (SELECT COUNT(*) FROM student_hidden_purchases WHERE student_id IN (990001, ${STUDENT_ID}))=0 AND
              (SELECT COUNT(*) FROM student_material_progress WHERE material_id=990001)=0 AND
              (SELECT COUNT(*) FROM student_favorites WHERE material_id=990001)=0 AND
              (SELECT COUNT(*) FROM archived_materials WHERE material_id=990001)=0 AND
              (SELECT COUNT(*) FROM preview_material_notes WHERE material_id=990001)=0
              THEN 'PREVIEW_DELETE_SMOKE_PASS' ELSE 'PREVIEW_DELETE_SMOKE_FAIL' END AS result;" \
            | tee /tmp/zm-delete-verify.txt
          grep -q "PREVIEW_DELETE_SMOKE_PASS" /tmp/zm-delete-verify.txt

      - name: Clean up isolated Preview fixtures
        if: always()
        run: npx --yes wrangler@4 d1 execute zm-academy-preview-db --remote --config wrangler.preview.toml --file=tests/preview-smoke-reset.sql
