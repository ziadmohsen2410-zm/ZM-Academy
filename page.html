<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#081226">
<title>ZM Academy | صفحة تعليمية</title>
<style>
:root{color-scheme:dark;--bg:#071226;--surface:#111b34;--text:#f4f7ff;--muted:#a5b3d0;--blue:#35a8ff;--purple:#9b70ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0%,#29366b88,transparent 36%),var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;line-height:1.8}.bar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px max(5%,calc((100% - 1100px)/2));border-bottom:1px solid #ffffff18;background:#0c1430cc}.bar a{color:#b7dfff;text-decoration:none}.main{max-width:1000px;margin:34px auto;padding:0 18px}.page{display:grid;gap:16px}.page h1{font-size:clamp(26px,5vw,44px);line-height:1.3}.block{padding:18px;border:1px solid #35a8ff38;background:linear-gradient(135deg,#111b34,#10152b);border-radius:16px;overflow-wrap:anywhere}.block h2{margin:0 0 8px}.block p{white-space:pre-wrap;color:#d4def1;margin:8px 0}.block a{display:inline-block;margin-top:8px;padding:9px 16px;border-radius:10px;background:linear-gradient(110deg,var(--blue),var(--purple));color:#fff;text-decoration:none}.block img{max-width:100%;max-height:460px;object-fit:contain;border-radius:12px}.error{padding:20px;background:#431c2e;border:1px solid #d64d7a;border-radius:12px}.muted{color:var(--muted)}@media(max-width:600px){.main{margin:20px auto}.bar{padding:14px 18px}}
</style>
</head>
<body>
<header class="bar"><strong>ZM Academy</strong><a href="index.html">العودة إلى الأكاديمية</a></header>
<main class="main"><h1 id="pageTitle">جارٍ تحميل الصفحة...</h1><div id="pageContent" class="page" aria-live="polite"></div></main>
<script>
(() => {
 const API='https://zm-academy-api.ziadmohsen4567.workers.dev';
 const host=document.getElementById('pageContent'),title=document.getElementById('pageTitle');
 const el=(tag,attrs={})=>{const n=document.createElement(tag);for(const [k,v] of Object.entries(attrs)){if(k==='text')n.textContent=String(v);else n.setAttribute(k,String(v));}return n;};
 const slug=new URLSearchParams(location.search).get('slug')||'';
 if(!/^[a-z0-9][a-z0-9-]{1,59}$/.test(slug)){title.textContent='صفحة غير صالحة';host.append(el('p',{class:'error',text:'رابط الصفحة غير صحيح.'}));return;}
 const typeTitles={heading:'h2',text:'p',card:'article',alert:'aside',section:'section',button:'div',video:'div',image:'figure',spacer:'div'};
 fetch(`${API}/api/pages/${encodeURIComponent(slug)}`,{cache:'no-store'}).then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw new Error(d.error||'تعذر تحميل الصفحة.');return d;}).then(d=>{
  title.textContent=d.page.title||'ZM Academy';host.replaceChildren();
  (d.page.document.blocks||[]).forEach(b=>{
   if(b.visible===false)return;const c=b.content||{},s=b.style||{};const tag=typeTitles[b.type]||'div';const wrap=el(tag,{class:'block'});
   if(/^#[0-9a-f]{6}$/i.test(s.color||''))wrap.style.color=s.color;if(/^#[0-9a-f]{6}$/i.test(s.background||''))wrap.style.background=s.background;
   if(['right','center','left'].includes(s.align))wrap.style.textAlign=s.align;if(Number.isFinite(Number(s.padding)))wrap.style.padding=`${Math.min(64,Math.max(0,Number(s.padding)))}px`;if(Number.isFinite(Number(s.radius)))wrap.style.borderRadius=`${Math.min(48,Math.max(0,Number(s.radius)))}px`;if(Number.isFinite(Number(s.fontSize)))wrap.style.fontSize=`${Math.min(48,Math.max(12,Number(s.fontSize)))}px`;
   if(b.type==='spacer'){wrap.style.minHeight='20px';wrap.style.border='0';wrap.style.background='transparent';}
   else if(b.type==='image'){
    if(c.src&&(/^https:\/\//i.test(c.src)||/^\/assets\/[a-z0-9_./-]+$/i.test(c.src)||/^\/api\/media\/\d+$/.test(c.src))){const imageSrc=c.src.startsWith('/api/media/')?API+c.src:c.src;const img=el('img',{src:imageSrc,alt:c.alt||''});img.loading='lazy';wrap.append(img);}
   }else{
    if(c.title){const h=el(b.type==='heading'?'h2':'strong',{text:c.title});wrap.append(h);}
    if(c.text){wrap.append(el('p',{text:c.text}));}
    if(['button','video'].includes(b.type)&&c.href&&(/^(https:\/\/|\/|#)/i.test(c.href))){const a=el('a',{href:c.href,text:c.buttonText||(b.type==='video'?'فتح الفيديو':'اعرف المزيد')});if(/^https:\/\//i.test(c.href)){a.target='_blank';a.rel='noopener noreferrer';}wrap.append(a);}
   }
   host.append(wrap);
  });
  if(!host.children.length)host.append(el('p',{class:'muted',text:'لا يوجد محتوى منشور في هذه الصفحة.'}));
 }).catch(e=>{title.textContent='تعذر تحميل الصفحة';host.replaceChildren(el('p',{class:'error',text:e.message}));});
})();
</script>
</body></html>
