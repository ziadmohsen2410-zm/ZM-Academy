<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#081226">
<title>ZM Academy | صفحة تعليمية</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap');

:root{color-scheme:dark;--bg:#071226;--surface:#111b34;--text:#f4f7ff;--muted:#a5b3d0;--blue:#2F80FF;--purple:#7B61FF;--gold:#D9A441}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0%,#2F80FF22,transparent 36%),var(--bg);color:var(--text);font-family:'Cairo',Tahoma,Arial,sans-serif;line-height:1.8}.bar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px max(5%,calc((100% - 1100px)/2));border-bottom:1px solid #ffffff18;background:#0c1430cc}.bar a{color:#b7dfff;text-decoration:none}.main{max-width:1000px;margin:34px auto;padding:0 18px}.page{display:grid;gap:16px}.page h1{font-size:clamp(26px,5vw,44px);line-height:1.3}.block{padding:18px;border:1px solid #2F80FF38;background:linear-gradient(135deg,#111b34,#10152b);border-radius:16px;overflow-wrap:anywhere}.block h2{margin:0 0 8px}.block p{white-space:pre-wrap;color:#d4def1;margin:8px 0}.block a{display:inline-block;margin-top:8px;padding:9px 16px;border-radius:10px;background:linear-gradient(110deg,#2F80FF,#7B61FF);color:#fff;text-decoration:none}.block img{max-width:100%;max-height:460px;object-fit:contain;border-radius:12px}.error{padding:20px;background:#431c2e;border:1px solid #d64d7a;border-radius:12px}.muted{color:var(--muted)}@media(max-width:600px){.main{margin:20px auto}.bar{padding:14px 18px}}
</style>
</head>
<body>
<header class="bar"><strong>ZM Academy</strong><a href="index.html">العودة إلى الأكاديمية</a></header>
<main class="main"><h1 id="pageTitle">جارٍ تحميل الصفحة...</h1><div id="pageContent" class="page" aria-live="polite"></div></main>
<script>
(() => {
 const API='https://zm-academy-api.ziadmohsen4567.workers.dev';
 const host=document.getElementById('pageContent'),title=document.getElementById('pageTitle');
 const el=(tag,attrs={})=>{const n=document.createElement(tag);for(const [k,v] of Object.entries(attrs)){if(k==='text')n.textContent=String(v);else n.setAttribute(k,String(v));}return n;};
 const slug=(new URLSearchParams(location.search).get('key')||new URLSearchParams(location.search).get('slug')||'').trim();
 if(!/^[a-z0-9][a-z0-9_-]{0,79}$/i.test(slug)){title.textContent='صفحة غير صالحة';host.append(el('p',{class:'error',text:'رابط الصفحة غير صحيح.'}));return;}
 const safeLink=value=>{const raw=String(value||'').trim();if(/^https:\/\//i.test(raw)||raw.startsWith('/')||raw.startsWith('#'))return raw;return '';};
 fetch(`${API}/api/public/pages/${encodeURIComponent(slug)}`,{cache:'no-store'}).then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok||!d.success||!d.page)throw new Error(d.error||'الصفحة غير موجودة أو لم يتم نشرها.');return d;}).then(d=>{
  title.textContent=d.page.title||'ZM Academy';host.replaceChildren();
  const content=d.page.content||{};
  const blocks=Array.isArray(content.blocks)?content.blocks:(Array.isArray(content.document?.blocks)?content.document.blocks:[]);
  blocks.forEach(b=>{
   if(!b||typeof b!=='object'||b.visible===false)return;
   const c=b.content||{},style=b.style||{},platform=!b.content&&!b.style;
   const type=platform?b.type:(b.type||'text');
   const tag=platform?({hero:'section',card:'article',announcement:'aside',text:'section'}[type]||'section'):(typeTitles[type]||'div');
   const wrap=el(tag,{class:'block'});
   const color=platform?(b.color||''):style.color,background=platform?(b.background||''):style.background;
   if(/^#[0-9a-f]{6}$/i.test(color||''))wrap.style.color=color;
   if(/^#[0-9a-f]{6}$/i.test(background||''))wrap.style.background=background;
   if(!platform){
    if(['right','center','left'].includes(style.align))wrap.style.textAlign=style.align;
    if(Number.isFinite(Number(style.padding)))wrap.style.padding=`${Math.min(64,Math.max(0,Number(style.padding)))}px`;
    if(Number.isFinite(Number(style.radius)))wrap.style.borderRadius=`${Math.min(48,Math.max(0,Number(style.radius)))}px`;
    if(Number.isFinite(Number(style.fontSize)))wrap.style.fontSize=`${Math.min(48,Math.max(12,Number(style.fontSize)))}px`;
   }
   if(type==='spacer'){wrap.style.minHeight='20px';wrap.style.border='0';wrap.style.background='transparent';}
   else if(type==='image'){
    const src=platform?b.src:c.src,alt=platform?b.alt:c.alt;
    if(src&&(/^https:\/\//i.test(src)||/^\/assets\/[a-z0-9_./-]+$/i.test(src)||/^\/api\/media\/\d+$/.test(src))){const imageSrc=src.startsWith('/api/media/')?API+src:src;const img=el('img',{src:imageSrc,alt:alt||''});img.loading='lazy';wrap.append(img);}
   }else{
    const heading=platform?b.title:c.title,body=platform?b.text:c.text;
    if(heading)wrap.append(el(type==='hero'?'h2':'strong',{text:heading}));
    if(body)wrap.append(el('p',{text:body}));
    const href=safeLink(platform?b.buttonUrl:c.href),buttonText=platform?b.buttonText:c.buttonText;
    if((type==='button'||type==='video'||type==='hero')&&href){const a=el('a',{href,text:buttonText||(type==='video'?'فتح الفيديو':'اعرف المزيد')});if(/^https:\/\//i.test(href)){a.target='_blank';a.rel='noopener noreferrer';}wrap.append(a);}
   }
   host.append(wrap);
  });
  if(!host.children.length)host.append(el('p',{class:'muted',text:'لا يوجد محتوى منشور في هذه الصفحة.'}));
 }).catch(e=>{title.textContent='تعذر تحميل الصفحة';host.replaceChildren(el('p',{class:'error',text:e.message}));});
})();
</script>
</body></html>
