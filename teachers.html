<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d1b"><title>دليل المدرسين | ZM Academy</title><link rel="icon" href="./assets/academy-logo.jpg"><link rel="stylesheet" href="./social-pages.css"></head><body><div class="app"><header class="top"><a class="brand" href="./student.html">✦ ZM Academy</a><a class="ghost" href="./student.html" style="padding:8px 12px;border-radius:10px">لوحة الطالب ↗</a></header><div class="layout"><nav class="side"><a href="./feed.html" class="">📰 الأخبار والمنشورات</a><a href="./subjects.html" class="">📚 موادي</a><a href="./teachers.html" class="active">👩‍🏫 المدرسون</a><a href="./settings.html" class="">⚙️ إعداداتي</a></nav><main class="panel"><h1>دليل المدرسين</h1><div class="muted">مساحتك التعليمية والاجتماعية في ZM Academy</div><div id="status" class="status">اكتشف المدرسين والمواد التي يقدمونها.</div><div id="teachers"></div></main></div></div><script src="./social-pages.js"></script><script>const {api,$,esc,status}=window.ZM;async function load(){try{const d=await api('/api/student/platform/teachers');const rows=d.teachers||[];$('#teachers').innerHTML=rows.length?rows.map(t=>'<article class="teacher">'+(t.photo_url?'<img src="'+esc(t.photo_url)+'" alt="">':'')+'<div><h3>'+esc(t.display_name)+'</h3><div class="muted">'+esc(t.subject)+' · '+esc(t.grade||'كل الصفوف')+'</div><p>'+esc(t.bio||'')+'</p>'+(t.contact_url?'<a class="ghost" style="display:inline-block;padding:8px 12px;border-radius:10px" target="_blank" rel="noopener" href="'+esc(t.contact_url)+'">تواصل مع المدرس ↗</a>':'')+'</div></article>').join(''):'<div class="empty">لم تتم إضافة ملفات المدرسين بعد. ستظهر هنا عند نشرها من الإدارة.</div>'}catch(e){status(e.message)}}load();</script></body></html>
