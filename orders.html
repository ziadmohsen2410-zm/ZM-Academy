<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مشترياتي وطلباتي | ZM Academy</title><link rel="stylesheet" href="./social-pages.css"></head><body><div class="app"><header class="top"><a class="brand" href="./student.html">✦ ZM Academy</a><a class="ghost" href="./student.html" style="padding:8px 12px;border-radius:10px">لوحة الطالب ↗</a></header><div class="layout"><nav class="side"><a href="./feed.html">📰 الأخبار</a><a href="./subjects.html">📚 ترتيب المواد</a><a href="./materials.html" >📖 المحتوى</a><a href="./progress.html" >📈 تقدمي</a><a href="./orders.html" class="active">🛒 مشترياتي</a><a href="./teachers.html">👩‍🏫 المدرسون</a><a href="./settings.html">⚙️ الإعدادات</a></nav><main class="panel"><h1>مشترياتي وطلباتي</h1><div id="status" class="status">جارٍ تحميل الطلبات...</div><div id="orders"></div></main></div></div><script src="./social-pages.js"></script><script>const {api,$,esc,status}=window.ZM;async function load(){try{const d=await api('/api/student/purchases');const rows=d.purchases||d.orders||[];$('#orders').innerHTML=rows.length?rows.map(o=>'<article class="post"><h3>'+esc(o.material_title||o.title||'طلب شراء')+'</h3><div class="muted">رقم الطلب: '+esc(o.order_id||o.id)+' · '+esc(o.created_at||'')+'</div><p>الحالة: '+esc(o.status||'قيد المراجعة')+'</p></article>').join(''):'<div class="empty">لا توجد مشتريات أو طلبات حتى الآن.</div>';status('سجل الطلبات الخاص بحسابك')}catch(e){status(e.message)}}load();</script></body></html>
