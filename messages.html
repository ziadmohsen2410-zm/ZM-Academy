<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رسائلي | ZM Academy</title><link rel="stylesheet" href="./social-pages.css"></head><body><div class="app"><header class="top"><a class="brand" href="./student.html">✦ ZM Academy</a><a class="ghost" href="./teachers.html" style="padding:8px 12px;border-radius:10px">دليل المدرسين ↗</a></header><div class="layout"><nav class="side"><a href="./feed.html">📰 الأخبار</a><a href="./subjects.html">📚 المواد</a><a href="./teachers.html">👩‍🏫 المدرسون</a><a class="active" href="./messages.html">✉️ رسائلي</a><a href="./settings.html">⚙️ الإعدادات</a></nav><main class="panel"><h1>مراسلة المدرسين</h1><div id="status" class="status">اختر مدرسًا لبدء المحادثة.</div><div class="field"><label>المدرس</label><select id="teacher"></select></div><div id="thread"></div><div class="field"><textarea id="message" maxlength="2000" placeholder="اكتب رسالتك للمدرس..."></textarea></div><button id="send">إرسال الرسالة</button></main></div></div><script src="./social-pages.js"></script><script>
const {api,$,esc,status}=window.ZM;let teacherId=Number(new URLSearchParams(location.search).get('teacher')||0);
async function loadTeachers(){try{const d=await api('/api/student/platform/teachers'),rows=d.teachers||[];$('#teacher').innerHTML=rows.map(t=>'<option value="'+t.id+'">'+esc(t.display_name)+' — '+esc(t.subject)+'</option>').join('');if(teacherId&&rows.some(t=>Number(t.id)===teacherId))$('#teacher').value=String(teacherId);else teacherId=Number($('#teacher').value||0);await loadThread()}catch(e){status(e.message)}}
async function loadThread(){teacherId=Number($('#teacher').value||0);if(!teacherId){$('#thread').innerHTML='<div class="empty">لا يوجد مدرسون متاحون للمراسلة بعد.</div>';return}try{const d=await api('/api/student/platform/messages?teacher_id='+teacherId);$('#thread').innerHTML=(d.messages||[]).map(m=>'<div class="status"><b>'+(m.sender_type==='student'?'أنت':'المدرس')+'</b><div>'+esc(m.body)+'</div><small>'+esc(m.created_at||'')+'</small></div>').join('')||'<div class="empty">ابدأ المحادثة برسالتك الأولى.</div>'}catch(e){status(e.message)}}
$('#teacher').onchange=loadThread;$('#send').onclick=async()=>{try{const body=$('#message').value.trim();if(!body)return status('اكتب الرسالة أولًا.');await api('/api/student/platform/messages',{method:'POST',body:JSON.stringify({teacher_id:teacherId,body})});$('#message').value='';status('تم إرسال رسالتك.');loadThread()}catch(e){status(e.message)}};loadTeachers();
</script></body></html>
