<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محتواي الدراسي | ZM Academy</title><link rel="stylesheet" href="./social-pages.css"></head><body><div class="app"><header class="top"><a class="brand" href="./student.html">✦ ZM Academy</a><a class="ghost" href="./student.html" style="padding:8px 12px;border-radius:10px">لوحة الطالب ↗</a></header><div class="layout"><nav class="side"><a href="./feed.html">📰 الأخبار</a><a href="./subjects.html">📚 ترتيب المواد</a><a href="./materials.html" class="active">📖 المحتوى</a><a href="./progress.html" >📈 تقدمي</a><a href="./orders.html" >🛒 مشترياتي</a><a href="./teachers.html">👩‍🏫 المدرسون</a><a href="./settings.html">⚙️ الإعدادات</a></nav><main class="panel"><h1>محتواي الدراسي</h1><div id="status" class="status">جارٍ تحميل المحتوى...</div><div id="materials"></div></main></div></div><script src="./social-pages.js"></script><script>const {api,$,esc,status}=window.ZM;async function load(){try{const d=await api('/api/materials');const rows=d.materials||[];$('#materials').innerHTML=rows.length?rows.map(m=>'<article class="post"><h3>'+esc(m.title)+'</h3><div class="muted">المادة رقم '+esc(m.subject_id)+' · '+esc(m.type||'محتوى')+'</div><p>'+(Number(m.is_free)===1?'مجاني':'متاح حسب حالة الشراء')+'</p><a class="ghost" style="display:inline-block;padding:8px 12px;border-radius:10px" href="./student.html#paidSection">فتح المحتوى من مكتبتي ↗</a></article>').join(''):'<div class="empty">لا يوجد محتوى متاح في موادك حاليًا.</div>';status('عدد العناصر المتاحة: '+rows.length)}catch(e){status(e.message)}}load();</script></body></html>
