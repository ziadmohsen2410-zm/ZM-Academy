<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d1b"><title>إعدادات حسابي | ZM Academy</title><link rel="icon" href="./assets/academy-logo.jpg"><link rel="stylesheet" href="./social-pages.css"></head><body><div class="app"><header class="top"><a class="brand" href="./student.html">✦ ZM Academy</a><a class="ghost" href="./student.html" style="padding:8px 12px;border-radius:10px">لوحة الطالب ↗</a></header><div class="layout"><nav class="side"><a href="./feed.html" class="">📰 الأخبار والمنشورات</a><a href="./subjects.html" class="">📚 موادي</a><a href="./teachers.html" class="">👩‍🏫 المدرسون</a><a href="./settings.html" class="active">⚙️ إعداداتي</a></nav><main class="panel"><h1>إعدادات حسابي</h1><div class="muted">مساحتك التعليمية والاجتماعية في ZM Academy</div><div id="status" class="status">جارٍ تحميل بيانات الحساب...</div><div class="field"><label>الاسم الظاهر</label><input id="displayName" maxlength="40" placeholder="الاسم الذي يظهر في المجتمع"></div><div class="field"><label>نبذة عني</label><textarea id="bio" maxlength="240" placeholder="اكتب نبذة قصيرة..."></textarea></div><button id="save">حفظ التغييرات</button><p class="muted">الاسم هنا هو اسم العرض داخل المجتمع فقط، ولا يغيّر بيانات التسجيل الرسمية.</p></main></div></div><script src="./social-pages.js"></script><script>const {api,$,status}=window.ZM;async function load(){try{const d=await api('/api/student/platform/profile');$('#displayName').value=d.profile?.display_name||'';$('#bio').value=d.profile?.bio||'';status('يمكنك تعديل الاسم الظاهر والنبذة الشخصية.')}catch(e){status(e.message)}}$('#save').onclick=async()=>{try{await api('/api/student/platform/profile',{method:'PUT',body:JSON.stringify({display_name:$('#displayName').value,bio:$('#bio').value})});status('تم حفظ إعدادات الملف الشخصي بنجاح.')}catch(e){status(e.message)}};load();</script></body></html>
