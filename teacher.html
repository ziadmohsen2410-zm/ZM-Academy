<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071226"><title>بوابة المدرس | ZM Academy</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,#16376a,transparent 35%),#071226;color:#f7f9ff;font-family:Tahoma,Arial,sans-serif;padding:20px}.wrap{max-width:900px;margin:auto}.card{background:#0d1b35;border:1px solid #24436e;border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 16px 45px #0005}h1{margin:0 0 8px;color:#8ebcff}p,.muted{color:#aebed8}input,select,button{font:inherit;border-radius:11px;padding:12px;border:1px solid #34527b;background:#09172d;color:#fff;width:100%;margin:6px 0}button{background:linear-gradient(110deg,#2678ff,#8657ed);border:0;font-weight:bold;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.student{padding:12px;border:1px solid #24436e;border-radius:12px;margin:8px 0}.hidden{display:none}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.top button{width:auto}.error{color:#ff9cac}.ok{color:#70e0ba}a{color:#9bc5ff}
</style></head><body><main class="wrap">
<div class="top"><div><h1>ZM Academy | بوابة المدرس</h1><p>مساحة العمل الخاصة بالصفوف والمواد المسندة إليك</p></div><button id="logout" class="hidden">تسجيل الخروج</button></div>
<section class="card" id="loginBox"><h2>تسجيل دخول المدرس</h2><input id="username" placeholder="اسم المستخدم" autocomplete="username"><input id="password" type="password" placeholder="كلمة المرور" autocomplete="current-password"><button id="login">دخول</button><p id="loginMsg"></p><a href="./index.html">العودة للأكاديمية</a></section>
<section class="card hidden" id="portal"><h2 id="welcome">أهلاً بك</h2><p class="muted">اختر إسنادًا لعرض كشف طلاب الصف المرتبط به.</p><div class="grid"><div><label>الصف المسند</label><select id="grade"></select></div><div><label>المادة المسندة</label><select id="subject"></select></div></div><button id="loadRoster">عرض كشف الطلاب</button><p id="status"></p><div id="roster"></div></section>
</main><script>
const API='https://zm-academy-api.ziadmohsen4567-workers.dev'.replace('4567-workers','4567');
const KEY='zm_teacher_token';let token=localStorage.getItem(KEY)||'',assignments=[];
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function req(path,opts={}){const r=await fetch(API+path,{...opts,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opts.headers||{})}});const d=await r.json().catch(()=>({success:false,error:'استجابة غير مفهومة'}));if(!r.ok||!d.success)throw Error(d.error||'تعذر تنفيذ الطلب');return d}
function showPortal(data){assignments=data.assignments||[];$('welcome').textContent='أهلاً '+(data.teacher?.name||'بك');$('grade').innerHTML=assignments.map(x=>'<option value="'+esc(x.grade)+'">'+esc(x.grade)+'</option>').join('');fillSubjects();$('loginBox').classList.add('hidden');$('portal').classList.remove('hidden');$('logout').classList.remove('hidden')}
function fillSubjects(){const g=$('grade').value,rows=assignments.filter(x=>x.grade===g);$('subject').innerHTML=rows.map(x=>'<option value="'+esc(x.subject)+'">'+esc(x.subject)+'</option>').join('')}
async function load(){const d=await req('/api/admin/platform/teacher-portal/me');if(!assignments.length)showPortal(d);else showPortal(d)}
async function login(){ $('loginMsg').textContent='جارٍ تسجيل الدخول...';try{const r=await fetch(API+'/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value.trim(),password:$('password').value})});const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'بيانات الدخول غير صحيحة');token=d.token;localStorage.setItem(KEY,token);const me=await req('/api/admin/platform/teacher-portal/me');showPortal(me);$('loginMsg').textContent=''}catch(e){$('loginMsg').textContent=e.message;$('loginMsg').className='error'}}
$('login').onclick=login;$('grade').onchange=fillSubjects;
$('loadRoster').onclick=async()=>{try{const q='?grade='+encodeURIComponent($('grade').value)+'&subject='+encodeURIComponent($('subject').value);const d=await req('/api/admin/platform/teacher-portal/roster'+q);$('status').textContent='عدد الطلاب: '+d.students.length;$('status').className='ok';$('roster').innerHTML=d.students.map(x=>'<div class="student"><b>'+esc(x.name)+'</b><div class="muted">'+esc(x.grade)+(x.school?' · '+esc(x.school):'')+'</div></div>').join('')||'<p>لا يوجد طلاب في هذا الصف حاليًا.</p>'}catch(e){$('status').textContent=e.message;$('status').className='error';$('roster').innerHTML=''}};
$('logout').onclick=()=>{localStorage.removeItem(KEY);token='';location.reload()};
if(token)load().catch(()=>{localStorage.removeItem(KEY);token=''});
</script></body></html>
