<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة المجتمع | ZM Academy</title><link rel="stylesheet" href="./social-pages.css"></head><body><div class="app"><header class="top"><a class="brand" href="./admin.html">✦ ZM Academy · الإدارة</a><a class="ghost" href="./social-inbox.html" style="padding:8px 12px;border-radius:10px">رسائل الطلاب ↗</a><a class="ghost" href="./admin.html" style="padding:8px 12px;border-radius:10px">لوحة الإدارة ↗</a></header><main class="panel" style="margin-top:16px"><h1>إدارة مجتمع الأكاديمية</h1><div class="muted">انشر أخبار الأكاديمية وأضف ملفات المدرسين التي يراها الطلاب.</div><div id="status" class="status">جارٍ التحقق من الجلسة...</div><section class="post"><h2>نشر منشور جديد</h2><div class="field"><label>عنوان المنشور</label><input id="postTitle" maxlength="160"></div><div class="field"><label>التفاصيل</label><textarea id="postBody" maxlength="5000"></textarea></div><div class="field"><label>رابط صورة (اختياري — HTTPS)</label><input id="postImage" type="url"></div><div class="field"><label>رابط إضافي (اختياري — HTTPS)</label><input id="postLink" type="url"></div><div class="field"><label>الجمهور</label><select id="audience"><option value="all">كل الطلاب</option><option value="grade">صف دراسي محدد</option><option value="student">طالب محدد</option></select></div><div class="field"><label>الصف أو رقم الطالب</label><input id="audienceValue" placeholder="يُترك فارغًا عند اختيار كل الطلاب"></div><button id="publish">نشر المنشور</button></section><section class="post"><h2>إضافة مدرس إلى الدليل</h2><div class="field"><label>اسم المدرس</label><input id="teacherName" maxlength="100"></div><div class="field"><label>المادة</label><input id="teacherSubject" maxlength="120"></div><div class="field"><label>الصفوف</label><input id="teacherGrade" maxlength="80"></div><div class="field"><label>نبذة</label><textarea id="teacherBio" maxlength="1000"></textarea></div><div class="field"><label>رابط الصورة (HTTPS)</label><input id="teacherPhoto" type="url"></div><div class="field"><label>رابط التواصل (HTTPS)</label><input id="teacherContact" type="url"></div><button id="addTeacher">إضافة المدرس</button></section><section class="post"><h2>المنشورات الحالية</h2><div id="posts"></div></section><section class="post"><h2>دليل المدرسين</h2><div id="teachers"></div></section></main></div><script>
const API='https://zm-academy-api.ziadmohsen4567.workers.dev',token=localStorage.getItem('zm_admin_token')||sessionStorage.getItem('zm_admin_token')||(()=>{try{const m=document.cookie.match(/(?:^|;\s*)zm_admin_token=([^;]+)/);return m?decodeURIComponent(m[1]):''}catch{return ''}})(),$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opts={}){if(!token){location.replace('./admin.html');throw Error('يلزم تسجيل الدخول كمسؤول')}const h={Authorization:'Bearer '+token,...(opts.headers||{})};if(opts.body)h['Content-Type']='application/json';const r=await fetch(API+path,{...opts,headers:h}),d=await r.json().catch(()=>({}));if(!r.ok||d.success===false)throw Error(d.error||'تعذر تنفيذ الطلب');return d}function status(s){$('#status').textContent=s}
async function load(){try{const d=await api('/api/admin/platform/posts');$('#posts').innerHTML=(d.posts||[]).map(p=>'<div class="status"><b>'+esc(p.title)+'</b><p>'+esc(p.body)+'</p><button class="ghost" data-del-post="'+p.id+'">إلغاء النشر</button></div>').join('')||'<div class="empty">لا توجد منشورات.</div>';document.querySelectorAll('[data-del-post]').forEach(b=>b.onclick=async()=>{if(!confirm('إلغاء نشر هذا المنشور؟'))return;try{await api('/api/admin/platform/posts/'+b.dataset.delPost,{method:'DELETE'});load()}catch(e){status(e.message)}});const t=await api('/api/admin/platform/teachers');$('#teachers').innerHTML=(t.teachers||[]).map(x=>'<div class="status"><b>'+esc(x.display_name)+'</b> · '+esc(x.subject)+' <button class="ghost" data-del-teacher="'+x.id+'">إخفاء</button></div>').join('')||'<div class="empty">لا يوجد مدرسون مضافون.</div>';document.querySelectorAll('[data-del-teacher]').forEach(b=>b.onclick=async()=>{try{await api('/api/admin/platform/teachers/'+b.dataset.delTeacher,{method:'DELETE'});load()}catch(e){status(e.message)}});status('لوحة المجتمع جاهزة للنشر والإدارة.')}catch(e){status(e.message)}}
$('#publish').onclick=async()=>{try{await api('/api/admin/platform/posts',{method:'POST',body:JSON.stringify({title:$('#postTitle').value,body:$('#postBody').value,image_url:$('#postImage').value,link_url:$('#postLink').value,audience_type:$('#audience').value,audience_value:$('#audienceValue').value})});['postTitle','postBody','postImage','postLink','audienceValue'].forEach(id=>$('#'+id).value='');status('تم نشر المنشور للطلاب المستهدفين.');load()}catch(e){status(e.message)}};
$('#addTeacher').onclick=async()=>{try{await api('/api/admin/platform/teachers',{method:'POST',body:JSON.stringify({display_name:$('#teacherName').value,subject:$('#teacherSubject').value,grade:$('#teacherGrade').value,bio:$('#teacherBio').value,photo_url:$('#teacherPhoto').value,contact_url:$('#teacherContact').value})});['teacherName','teacherSubject','teacherGrade','teacherBio','teacherPhoto','teacherContact'].forEach(id=>$('#'+id).value='');status('تمت إضافة المدرس إلى الدليل.');load()}catch(e){status(e.message)}};load();
</script></body></html>
