<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d1b"><title>ترتيب موادي | ZM Academy</title><link rel="icon" href="./assets/academy-logo.jpg"><link rel="stylesheet" href="./social-pages.css"></head><body><div class="app"><header class="top"><a class="brand" href="./student.html">✦ ZM Academy</a><a class="ghost" href="./student.html" style="padding:8px 12px;border-radius:10px">لوحة الطالب ↗</a></header><div class="layout"><nav class="side"><a href="./feed.html" class="">📰 الأخبار والمنشورات</a><a href="./subjects.html" class="active">📚 موادي</a><a href="./teachers.html" class="">👩‍🏫 المدرسون</a><a href="./settings.html" class="">⚙️ إعداداتي</a></nav><main class="panel"><h1>ترتيب موادي</h1><div class="muted">مساحتك التعليمية والاجتماعية في ZM Academy</div><div id="status" class="status">رتّب المواد حسب أولوياتك باستخدام السهمين.</div><div id="subjects"></div><button id="save">حفظ ترتيب المواد</button></main></div></div><script src="./social-pages.js"></script><script>const {api,$,status,esc}=window.ZM;let ids=[];async function load(){try{const a=await Promise.all([api('/api/subjects'),api('/api/student/platform/subjects/order')]);const rows=a[0].subjects||a[0].data||[];const order=a[1].subject_ids||[];rows.sort((x,y)=>{const i=order.indexOf(Number(x.id)),j=order.indexOf(Number(y.id));return(i<0?999:i)-(j<0?999:j)});ids=rows.map(x=>Number(x.id));draw(rows)}catch(e){status(e.message)}}function draw(rows){$('#subjects').innerHTML=rows.length?rows.map((x,i)=>'<div class="subject"><div><b>'+esc(x.name||x.title||'مادة')+'</b><div class="muted">'+esc(x.grade||'')+'</div></div><div class="actions"><button class="ghost" data-up="'+i+'" '+(i===0?'disabled':'')+'>↑</button><button class="ghost" data-down="'+i+'" '+(i===rows.length-1?'disabled':'')+'>↓</button></div></div>').join(''):'<div class="empty">لا توجد مواد متاحة حاليًا.</div>';document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>move(+b.dataset.up,-1));document.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>move(+b.dataset.down,1))}function move(i,d){const j=i+d;[ids[i],ids[j]]=[ids[j],ids[i]];const rows=[...$('#subjects').children].map((el)=>({id:Number(el.querySelector('[data-up]').dataset.id||0),html:el}));const current=[...$('#subjects').children];const node=current[i];if(d<0)node.parentNode.insertBefore(node,current[j]);else node.parentNode.insertBefore(current[j],node);document.querySelectorAll('#subjects .subject').forEach((el,k)=>{el.querySelector('[data-up]').dataset.up=k;el.querySelector('[data-down]').dataset.down=k;el.querySelector('[data-up]').disabled=k===0;el.querySelector('[data-down]').disabled=k===ids.length-1})}$('#save').onclick=async()=>{try{await api('/api/student/platform/subjects/order',{method:'PUT',body:JSON.stringify({subject_ids:ids})});status('تم حفظ ترتيب المواد في حسابك.')}catch(e){status(e.message)}};load();</script></body></html>
