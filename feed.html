<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d1b"><title>مجتمع الأكاديمية | ZM Academy</title><link rel="icon" href="./assets/academy-logo.jpg"><link rel="stylesheet" href="./social-pages.css"></head><body><div class="app"><header class="top"><a class="brand" href="./student.html">✦ ZM Academy</a><a class="ghost" href="./student.html" style="padding:8px 12px;border-radius:10px">لوحة الطالب ↗</a></header><div class="layout"><nav class="side"><a href="./feed.html" class="active">📰 الأخبار والمنشورات</a><a href="./subjects.html" class="">📚 موادي</a><a href="./teachers.html" class="">👩‍🏫 المدرسون</a><a href="./settings.html" class="">⚙️ إعداداتي</a></nav><main class="panel"><h1>مجتمع الأكاديمية</h1><div class="muted">مساحتك التعليمية والاجتماعية في ZM Academy</div><div id="status" class="status">جارٍ تحميل آخر أخبار الأكاديمية...</div><div id="feed"></div></main></div></div><script src="./social-pages.js"></script><script>const {api,$,esc,status}=window.ZM;async function comments(id){const box=$('#comments-'+id);try{const d=await api('/api/student/platform/feed/'+id+'/comments');box.innerHTML=(d.comments||[]).map(c=>'<div class="status"><b>'+esc(c.author_name)+'</b><div>'+esc(c.body)+'</div></div>').join('')+'<div class="field"><textarea id="comment-'+id+'" placeholder="اكتب تعليقك..."></textarea><button id="send-'+id+'">نشر التعليق</button></div>';$('#send-'+id).onclick=async()=>{try{await api('/api/student/platform/feed/'+id+'/comments',{method:'POST',body:JSON.stringify({body:$('#comment-'+id).value})});comments(id)}catch(e){status(e.message)}}}catch(e){status(e.message)}}async function load(){try{const d=await api('/api/student/platform/feed');const posts=d.posts||[];$('#feed').innerHTML=posts.length?posts.map(p=>'<article class="post"><div class="muted">'+esc(p.created_by||'إدارة الأكاديمية')+' · '+esc(p.created_at||'')+'</div><h3>'+esc(p.title)+'</h3><p>'+esc(p.body)+'</p>'+(p.image_url?'<img src="'+esc(p.image_url)+'" alt="">':'')+(p.link_url?'<p><a target="_blank" rel="noopener" href="'+esc(p.link_url)+'">افتح الرابط ↗</a></p>':'')+'<div class="actions"><button data-like="'+p.id+'">'+(p.liked?'♥ أعجبني':'♡ إعجاب')+' · '+(p.likes_count||0)+'</button><button class="ghost" data-comments="'+p.id+'">التعليقات · '+(p.comments_count||0)+'</button></div><div id="comments-'+p.id+'"></div></article>').join(''):'<div class="empty">لا توجد منشورات بعد. تابع أخبار الأكاديمية هنا.</div>';status('آخر تحديثات الأكاديمية');document.querySelectorAll('[data-like]').forEach(b=>b.onclick=async()=>{try{await api('/api/student/platform/feed/'+b.dataset.like+'/like',{method:'POST'});load()}catch(e){status(e.message)}});document.querySelectorAll('[data-comments]').forEach(b=>b.onclick=()=>comments(b.dataset.comments))}catch(e){status(e.message)}}load();</script></body></html>
