<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تقدمي الدراسي | ZM Academy</title><link rel="stylesheet" href="./social-pages.css"></head><body><div class="app"><header class="top"><a class="brand" href="./student.html">✦ ZM Academy</a><a class="ghost" href="./student.html" style="padding:8px 12px;border-radius:10px">لوحة الطالب ↗</a></header><div class="layout"><nav class="side"><a href="./feed.html">📰 الأخبار</a><a href="./subjects.html">📚 ترتيب المواد</a><a href="./materials.html" >📖 المحتوى</a><a href="./progress.html" class="active">📈 تقدمي</a><a href="./orders.html" >🛒 مشترياتي</a><a href="./teachers.html">👩‍🏫 المدرسون</a><a href="./settings.html">⚙️ الإعدادات</a></nav><main class="panel"><h1>تقدمي الدراسي</h1><div id="status" class="status">جارٍ تحميل التقدم...</div><div id="progress"></div></main></div></div><script src="./social-pages.js"></script><script>const {api,$,esc,status}=window.ZM;async function load(){try{const d=await api('/api/student/progress');const rows=d.progress||[];$('#progress').innerHTML=rows.length?rows.map(p=>'<article class="post"><h3>'+esc(p.material_title||p.title||'درس')+'</h3><div class="muted">آخر تحديث: '+esc(p.updated_at||p.created_at||'')+'</div><p>'+(p.completed_at||Number(p.completed)===1?'مكتمل ✓':'قيد الدراسة')+'</p></article>').join(''):'<div class="empty">ابدأ دراسة المحتوى لتظهر متابعة تقدمك هنا.</div>';status('متابعة إنجازك الدراسي')}catch(e){status(e.message)}}load();</script></body></html>
