
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09090b">
<title>تسجيل طالب | ZM Academy</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at top,#211b10,#09090b 65%);color:#f7f4ed;font-family:Tahoma,Arial,sans-serif}
.panel{width:min(100%,460px);padding:30px;background:#141416;border:1px solid rgba(214,179,106,.35);border-radius:20px;box-shadow:0 20px 70px #000}
.brand{text-align:center;color:#e8ce91;font-weight:bold}
.brand small{display:block;font-size:11px;margin-top:5px;color:#aaa}
h1{text-align:center;font-size:25px;margin:24px 0 8px}
.sub{text-align:center;color:#b8b2a5;font-size:14px;margin:0 0 25px}
label{display:block;margin:16px 0 7px;color:#e8ce91;font-size:14px}
input{width:100%;padding:14px;border-radius:10px;border:1px solid #48402e;background:#0d0d0f;color:white;font:inherit;outline:none}
input:focus{border-color:#d6b36a}
button,.back{display:block;width:100%;padding:14px;margin-top:22px;border:0;border-radius:10px;background:linear-gradient(135deg,#e2c47f,#b58a3d);color:#17130b;font-weight:bold;font-size:16px;text-align:center;text-decoration:none;cursor:pointer}
button:disabled{opacity:.6}
.back{margin-top:12px;background:transparent;border:1px solid #69552e;color:#e8ce91;font-size:14px}
#message{margin-top:16px;text-align:center;font-size:14px;line-height:1.8}
.hint{color:#aaa;font-size:12px;text-align:center;margin-top:18px}
</style>
</head>
<body>
<main class="panel">
 <div class="brand">أكاديمية أ. زياد محسن
 <small>ZIAD MOHSEN ACADEMY</small></div>
 <h1>تسجيل طالب جديد</h1>
 <p class="sub">سجّل بياناتك للانضمام إلى الأكاديمية ومتابعة طلباتك التعليمية.</p>

 <form id="registerForm">
  <label for="name">اسم الطالب بالكامل</label>
  <input id="name" name="name" autocomplete="name" maxlength="120" required placeholder="اكتب اسمك بالكامل">

  <label for="phone">رقم الهاتف</label>
  <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="30" required placeholder="مثال: 01xxxxxxxxx">

  <button id="submitBtn" type="submit">تأكيد التسجيل</button>
 </form>

 <div id="message" role="status" aria-live="polite"></div>
 <a class="back" href="./index.html">العودة للصفحة الرئيسية</a>
 <div class="hint">بياناتك تُستخدم للتسجيل والتواصل بخصوص خدمات الأكاديمية.</div>
</main>

<script>
const API="https://zm-academy-api.ziadmohsen4567.workers.dev";
const form=document.getElementById("registerForm");
const btn=document.getElementById("submitBtn");
const msg=document.getElementById("message");

form.addEventListener("submit",async e=>{
 e.preventDefault();

 const name=document.getElementById("name").value.trim();
 const phone=document.getElementById("phone").value.trim();

 if(name.length<2||phone.replace(/\s+/g,"").length<8){
  msg.style.color="#ffb6a8";
  msg.textContent="تأكد من كتابة الاسم ورقم هاتف صحيح.";
  return;
 }

 btn.disabled=true;
 btn.textContent="جارٍ التسجيل...";
 msg.textContent="";

 try{
  const res=await fetch(API+"/api/students/register",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({name,phone})
  });

  const data=await res.json();

  if(!res.ok||!data.success){
   throw new Error(data.error||"تعذر إتمام التسجيل.");
  }

  msg.style.color="#a8e6b0";
  msg.textContent="تم تسجيلك بنجاح! رقم تسجيلك: "+data.student_id+" — احتفظ به عند التواصل مع الأكاديمية.";
  form.reset();

 }catch(err){
  msg.style.color="#ffb6a8";
  msg.textContent=err.message==="Failed to fetch"
   ?"تعذر الاتصال بالخادم. حاول مرة أخرى بعد قليل."
   :err.message;
 }finally{
  btn.disabled=false;
  btn.textContent="تأكيد التسجيل";
 }
});
</script>
</body>
</html>
