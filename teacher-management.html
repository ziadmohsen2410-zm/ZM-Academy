<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071226"><title>إدارة حسابات المدرسين | ZM Academy</title>
<style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,#16376a,transparent 35%),#071226;color:#f7f9ff;font-family:Tahoma,Arial,sans-serif;padding:20px}.wrap{max-width:900px;margin:auto}.card{background:#0d1b35;border:1px solid #24436e;border-radius:20px;padding:20px;margin:14px 0}h1{color:#8ebcff}input,button{font:inherit;border-radius:11px;padding:12px;border:1px solid #34527b;background:#09172d;color:#fff;width:100%;margin:6px 0}button{background:linear-gradient(110deg,#2678ff,#8657ed);border:0;font-weight:bold;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.muted{color:#aebed8}.item{border:1px solid #24436e;border-radius:12px;padding:12px;margin:8px 0}.error{color:#ff9cac}.ok{color:#70e0ba}.hidden{display:none}a{color:#9bc5ff}</style></head><body><main class="wrap">
<h1>ZM Academy | إدارة حسابات المدرسين</h1><p class="muted">إنشاء حساب مدرس وربطه بالصفوف والمواد المسندة إليه.</p>
<section class="card" id="loginBox"><h2>دخول الإدارة</h2><p class="muted">استخدم حساب الإدارة الذي يمتلك صلاحية إدارة الأدوار.</p><input id="username" placeholder="اسم مستخدم الإدارة"><input id="password" type="password" placeholder="كلمة المرور"><button id="login">دخول</button><p id="loginMsg"></p></section>
<section class="card hidden" id="manager"><h2>إنشاء حساب مدرس</h2><div class="grid"><input id="teacherName" placeholder="اسم المدرس"><input id="teacherUser" placeholder="اسم المستخدم"><input id="teacherPass" type="password" placeholder="كلمة مرور 12 حرفًا على الأقل"><input id="teacherEmail" type="email" placeholder="البريد الإلكتروني (اختياري)"><input id="grade" placeholder="الصف الدراسي"><input id="subject" placeholder="المادة المسندة"></div><button id="addAssignment">إضافة إسناد آخر</button><div id="assignments"></div><button id="create">إنشاء حساب المدرس</button><p id="msg"></p><h2>حسابات المدرسين</h2><div id="teachers"></div><a href="./teacher.html">فتح بوابة المدرس</a></section></main>
<script>
const API='https://zm-academy-api.ziadmohsen4567.workers.dev;const KEY='zm_admin_token';let token=localStorage.getItem(KEY)||'',assignments=[];
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function req(path,opts={}){const r=await fetch(API+path,{...opts,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opts.headers||{})}});const d=await r.json().catch(()=>({success:false,error:'استجابة غير مفهومة'}));if(!r.ok||!d.success)throw Error(d.error||'تعذر تنفيذ الطلب');return d}
function addRow(g='',s=''){const n=document.createElement('div');n.className='grid item';n.innerHTML='<input placeholder="الصف الدراسي" value="'+esc(g)+'"><input placeholder="المادة" value="'+esc(s)+'"><button type="button">حذف الإسناد</button>';n.querySelector('button').onclick=()=>n.remove();$('assignments').append(n)}
async function list(){const d=await req('/api/admin/platform/teacher-accounts');$('teachers').innerHTML=d.teachers.map(t=>'<div class="item"><b>'+esc(t.display_name||t.username)+'</b><div class="muted">اسم الدخول: '+esc(t.username)+' · الإسنادات: '+t.assignment_count+' · '+(Number(t.is_active)?'نشط':'موقوف')+'</div></div>').join('')||'<p>لا توجد حسابات مدرسين بعد.</p>'}
async function enter(){try{const d=await req('/api/admin/platform/me');if(!['super_admin','admin'].includes(d.admin.role))throw Error('يلزم حساب مدير أعلى أو مدير بصلاحية إدارة الأدوار.');$('loginBox').classList.add('hidden');$('manager').classList.remove('hidden');await list()}catch(e){$('loginMsg').textContent=e.message;$('loginMsg').className='error';localStorage.removeItem(KEY);token=''}}
$('login').onclick=async()=>{try{const r=await fetch(API+'/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value.trim(),password:$('password').value})});const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'تعذر تسجيل الدخول');token=d.token;localStorage.setItem(KEY,token);await enter()}catch(e){$('loginMsg').textContent=e.message}};
$('addAssignment').onclick=()=>addRow();
$('create').onclick=async()=>{try{const rows=[...$('assignments').children].map(x=>({grade:x.querySelectorAll('input')[0].value.trim(),subject:x.querySelectorAll('input')[1].value.trim()}));if($('grade').value.trim()&&$('subject').value.trim())rows.unshift({grade:$('grade').value.trim(),subject:$('subject').value.trim()});const d=await req('/api/admin/platform/teacher-accounts',{method:'POST',body:JSON.stringify({display_name:$('teacherName').value,username:$('teacherUser').value,password:$('teacherPass').value,email:$('teacherEmail').value,assignments:rows})});$('msg').textContent='تم إنشاء الحساب بنجاح. رقم الحساب: '+d.id;$('msg').className='ok';$('teacherName').value=$('teacherUser').value=$('teacherPass').value=$('teacherEmail').value=$('grade').value=$('subject').value='';$('assignments').innerHTML='';await list()}catch(e){$('msg').textContent=e.message;$('msg').className='error'}};
if(token)enter();
</script></body></html>
