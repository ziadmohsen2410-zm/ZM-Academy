<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="تابع تقدم ابنك والطلبات والإشعارات من بوابة ولي الأمر في ZM Academy.">
<meta property="og:title" content="بوابة ولي الأمر | ZM Academy">
<meta property="og:description" content="تابع تقدم ابنك والطلبات والإشعارات من بوابة ولي الأمر في ZM Academy.">
<meta property="og:type" content="website">
<link rel="canonical" href="https://ziadmohsen2410-zm.github.io/ZM-Academy/parent.html">
<title>بوابة ولي الأمر | ZM Academy</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap');

:root{--bg:#071226;--s:#0D1B35;--s2:#13284a;--t:#FFFFFF;--m:#9AA9C4;--p:#2F80FF;--q:#7B61FF;--line:#1B3157}
*{box-sizing:border-box}body{margin:0;font-family:'Cairo',Tahoma,Arial,sans-serif;background:radial-gradient(ellipse at 10% 0,rgba(47,128,255,.12),transparent 30%),var(--bg);color:var(--t)}main{max-width:1100px;margin:0 auto;padding:20px}
.card{background:linear-gradient(160deg,rgba(18,27,51,.96),rgba(12,19,36,.96));border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
h1,h2,h3{margin:0 0 12px}p{color:var(--m)}
input,textarea,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#0b1325;color:var(--t);margin:6px 0 12px}
button{border:0;border-radius:12px;padding:11px 14px;background:linear-gradient(120deg,var(--p),var(--q));color:#071226;font-weight:700;cursor:pointer}button.ghost{background:transparent;color:var(--t);border:1px solid var(--line)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.item{padding:12px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.02);margin-bottom:10px}.muted{color:var(--m);font-size:13px}
.hidden{display:none}.msg{padding:10px 12px;border-radius:10px;margin-bottom:12px;display:none}.msg.show{display:block;background:rgba(47,128,255,.08);border:1px solid var(--line)}
table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid rgba(255,255,255,.06);text-align:right;font-size:14px}.wrap{overflow:auto}
@media(max-width:800px){.row,.grid{grid-template-columns:1fr}input,button,select,textarea{min-height:44px;font-size:16px}main{padding:14px}}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #2F80FF;outline-offset:2px}
</style>
<link rel="stylesheet" href="./assets/zm-future-theme.css?v=1">
</head>
<body>
<main>
  <div class="card" style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap">
    <div><h1 data-i18n="title">بوابة ولي الأمر</h1><p class="muted" data-i18n="sub">متابعة الأبناء، النتائج، الطلبات، والتقارير.</p></div>
    <div><a href="./index.html"><button class="ghost">الرئيسية</button></a> <button class="ghost hidden" id="logoutBtn">تسجيل الخروج</button></div>
  </div>
  <div id="msg" class="msg"></div>

  <section id="authSec" class="row">
    <div class="card"><h2 data-i18n="login">تسجيل الدخول</h2>
      <label>اسم المستخدم</label><input id="lUser"><label>كلمة المرور</label><input id="lPass" type="password"><button id="loginBtn">دخول</button>
    </div>
    <div class="card"><h2 data-i18n="register">إنشاء حساب ولي أمر</h2>
      <label>الاسم</label><input id="rName"><label>اسم المستخدم</label><input id="rUser"><label>الهاتف</label><input id="rPhone"><label>البريد</label><input id="rEmail"><label>كلمة المرور</label><input id="rPass" type="password"><button id="regBtn">إنشاء حساب</button>
    </div>
  </section>

  <section id="appSec" class="hidden">
    <div class="grid">
      <div class="card"><h3>الحساب</h3><div id="meBox" class="muted"></div></div>
      <div class="card"><h3>ربط طالب</h3><label>اسم مستخدم الطالب</label><input id="linkUser"><label>هاتف الطالب</label><input id="linkPhone"><button id="linkBtn">إرسال طلب الربط</button></div>
      <div class="card"><h3>ملخص</h3><div id="summaryBox" class="muted">اختر طالبًا لعرض التفاصيل.</div></div>
    </div>
    <div class="card"><h3>الأبناء المرتبطون</h3><div id="childrenList"></div></div>
    <div class="card"><h3>الإشعارات</h3><div id="parentNotifications" class="muted">جارٍ تحميل الإشعارات...</div></div>
    <div class="card"><h3>تفاصيل الطالب</h3><div id="childDetails" class="muted">لم يتم اختيار طالب.</div></div>
  </section>
</main>
<script>
(()=>{
const API='https://zm-academy-api.ziadmohsen4567.workers.dev';
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
let token=localStorage.getItem('zm_parent_token')||'';
function msg(t){const m=$('#msg');m.textContent=t;m.className='msg show';setTimeout(()=>m.className='msg',4000)}
async function api(path,opts={}){const h={'Content-Type':'application/json',...(opts.headers||{})}; if(token) h.Authorization='Bearer '+token; const r=await fetch(API+path,{...opts,headers:h}); const d=await r.json().catch(()=>({})); if(!r.ok||d.success===false) throw new Error(d.error||'خطأ'); return d; }
async function boot(){ if(!token){$('#authSec').classList.remove('hidden');$('#appSec').classList.add('hidden');$('#logoutBtn').classList.add('hidden'); return;} try{ const me=await api('/api/parent/me'); $('#authSec').classList.add('hidden');$('#appSec').classList.remove('hidden');$('#logoutBtn').classList.remove('hidden'); $('#meBox').innerHTML=`<div><strong>${esc(me.parent.name)}</strong></div><div class="muted">${esc(me.parent.username)}</div>`; loadChildren(); loadParentNotifications(); }catch(e){ token=''; localStorage.removeItem('zm_parent_token'); boot(); } }
async function loadChildren(){ const d=await api('/api/parent/children'); const rows=d.children||[]; $('#childrenList').innerHTML=rows.length?rows.map(c=>`<div class="item"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><strong>${esc(c.name)}</strong> <span class="muted">(${esc(c.grade||'-')})</span><div class="muted">حالة الربط: ${esc(c.status)}</div></div>${c.status==='approved'?`<button onclick="window.__viewChild(${c.id})">عرض</button>`:'<span class="muted">بانتظار الموافقة</span>'}</div></div>`).join(''):'<div class="muted">لا يوجد أبناء مرتبطون.</div>'; }
async function loadParentNotifications(){try{const d=await api('/api/parent/notifications');const rows=d.notifications||[];$('#parentNotifications').innerHTML=rows.length?rows.map(n=>`<div class="item"><div style="display:flex;justify-content:space-between;gap:10px"><strong>${esc(n.title)}</strong>${Number(n.is_read)===0?`<button class="ghost" data-parent-read="${n.id}">تحديد كمقروء</button>`: '<span class="muted">مقروء</span>'}</div><div class="muted">${esc(n.type)} · ${esc(n.created_at||'')}</div><div>${esc(n.body)}</div></div>`).join(''):'<div class="muted">لا توجد إشعارات حاليًا.</div>';$('#parentNotifications').querySelectorAll('[data-parent-read]').forEach(btn=>btn.onclick=async()=>{try{await api('/api/parent/notifications/'+btn.dataset.parentRead+'/read',{method:'POST'});loadParentNotifications();}catch(e){msg(e.message);}});}catch(e){$('#parentNotifications').textContent=e.message;}}

window.__viewChild=async(id)=>{ try{ const d=await api(`/api/parent/children/${id}/overview`); const s=d.student||{}; $('#summaryBox').innerHTML=`<div><strong>${esc(s.name)}</strong></div><div class="muted">${esc(s.grade||'-')} - ${esc(s.school||'-')}</div>`; $('#childDetails').innerHTML=`<div class="grid"><div class="item"><strong>المواد</strong><div class="muted">${(d.subjects||[]).map(x=>esc(x.name)).join('، ')||'لا يوجد'}</div></div><div class="item"><strong>الطلبات</strong><div class="muted">${(d.orders||[]).length} طلب</div></div><div class="item"><strong>محاولات الاختبار</strong><div class="muted">${(d.attempts||[]).length} محاولة</div></div></div><h3>الطلبات</h3><div class="wrap"><table><thead><tr><th>ID</th><th>المحتوى</th><th>الحالة</th></tr></thead><tbody>${(d.orders||[]).map(o=>`<tr><td>${o.id}</td><td>${esc(o.material_title||'-')}</td><td>${esc(o.status||'-')}</td></tr>`).join('')||'<tr><td colspan="3" class="muted">لا يوجد</td></tr>'}</tbody></table></div><h3>الاختبارات</h3><div class="wrap"><table><thead><tr><th>الاختبار</th><th>الدرجة</th><th>الحالة</th></tr></thead><tbody>${(d.attempts||[]).map(a=>`<tr><td>${esc(a.exam_title||'-')}</td><td>${esc(a.score??'-')} / ${esc(a.max_score??'-')}</td><td>${esc(a.status||'-')}</td></tr>`).join('')||'<tr><td colspan="3" class="muted">لا يوجد</td></tr>'}</tbody></table></div>`; }catch(e){ msg(e.message); } };
$('#loginBtn').onclick=async()=>{ try{ const d=await api('/api/parent/login',{method:'POST',body:JSON.stringify({username:$('#lUser').value.trim(),password:$('#lPass').value})}); token=d.token; localStorage.setItem('zm_parent_token',token); msg('تم تسجيل الدخول'); boot(); }catch(e){ msg(e.message); } };
$('#regBtn').onclick=async()=>{ try{ await api('/api/parent/register',{method:'POST',body:JSON.stringify({name:$('#rName').value.trim(),username:$('#rUser').value.trim(),phone:$('#rPhone').value.trim(),email:$('#rEmail').value.trim(),password:$('#rPass').value})}); msg('تم إنشاء الحساب، يمكنك تسجيل الدخول'); }catch(e){ msg(e.message); } };
$('#linkBtn').onclick=async()=>{ try{ await api('/api/parent/link-request',{method:'POST',body:JSON.stringify({student_username:$('#linkUser').value.trim(),student_phone:$('#linkPhone').value.trim()})}); msg('تم إرسال طلب الربط'); loadChildren(); }catch(e){ msg(e.message); } };
$('#logoutBtn').onclick=async()=>{ try{ await api('/api/parent/logout',{method:'POST'}); }catch{} token=''; localStorage.removeItem('zm_parent_token'); boot(); };
boot();
})();
</script>
<script>
(function(){try{
  var k='zm-sw-reset-v19';
  if(!localStorage.getItem(k) && 'serviceWorker' in navigator){
    Promise.all([navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister()}))}), caches.keys().then(function(ks){return Promise.all(ks.map(function(c){return caches.delete(c)}))})]).finally(function(){localStorage.setItem(k,'1'); location.reload();});
  }
}catch(e){}})();
</script>
</body>
</html>
